version: "3.9"

services:
  # ── FastAPI backend ─────────────────────────────────────────────────────────
  api:
    build:
      context: .
      target: api
    container_name: ner_api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models          # persist trained model
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Streamlit frontend ──────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      target: frontend
    container_name: ner_frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
